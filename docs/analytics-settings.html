    <p>이 브라우저의 방문을 이용 통계에서 제외할 수 있어요. 한국·호주 등 위치나 인터넷 연결이 바뀌어도 유지됩니다.</p>

    <p><button id="exclude" class="primary">이 브라우저 접속 제외</button> <button id="include">다시 집계하기</button></p>
    <p><a href="./">학습 사이트로 돌아가기</a></p>
    <noscript>설정을 저장하려면 JavaScript를 허용해 주세요.</noscript>
